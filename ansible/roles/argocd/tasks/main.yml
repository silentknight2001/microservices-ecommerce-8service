---
- name: Create ArgoCD namespace
  command: kubectl create namespace {{ argocd_namespace }}
  register: argocd_ns
  failed_when:
  - argocd_ns.rc != 0
  - "'already exists' not in argocd_ns.stderr"
  changed_when: argocd_ns.rc == 0
  tags: argocd

- name: Install ArgoCD
  command: >
    kubectl apply -n {{ argocd_namespace }} --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  register: argocd_install
  changed_when: "'serverside-applied' in argocd_install.stdout"
  failed_when:
  - argocd_install.rc != 0
  tags: argocd

- name: Wait for ArgoCD server ready
  command: >
    kubectl rollout status deployment/argocd-server -n {{ argocd_namespace }} --timeout=300s
  register: argocd_server_status
  changed_when: false
  failed_when: argocd_server_status.rc != 0
  tags: argocd

- name: Wait for ArgoCD repo server ready
  command: >
    kubectl rollout status deployment/argocd-repo-server -n {{ argocd_namespace }} --timeout=300s
  changed_when: false
  tags: argocd

- name: Wait for ArgoCD application controller ready
  command: >
    kubectl rollout status statefulset/argocd-application-controller -n {{ argocd_namespace }} --timeout=300s
  changed_when: false
  tags: argocd

- name: Get ArgoCD initial admin password
  shell: >
    kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  changed_when: false
  no_log: true
  tags: argocd

- name: Check ArgoCD CLI installed
  command: argocd version --client
  register: argocd_cli_check
  changed_when: false
  failed_when: false
  tags: argocd

- name: Install ArgoCD CLI
  shell: |
    curl -sSL -o /tmp/argocd \
    https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
    chmod +x /tmp/argocd
    sudo mv /tmp/argocd /usr/local/bin/argocd
  when: argocd_cli_check.rc != 0
  changed_when: true
  tags: argocd

# Port Forward ArgoCD 
# Start ArgoCD port-forward in background
- name: Start ArgoCD port-forward in background
  shell: >
    nohup kubectl port-forward svc/argocd-server -n {{ argocd_namespace }} 8443:443 > /tmp/argocd-portforward.log 2>&1 &
  changed_when: false
  tags: argocd

- name: Wait for port-forward ready
  wait_for:
    host: localhost
    port: 8443
    timeout: 60 # ← increase from 30 to 60
    delay: 5 # ← wait 5 seconds before checking
  tags: argocd

- name: Login to ArgoCD
  command: >
    argocd login localhost:8443 --username admin --password {{ argocd_password.stdout }} --insecure
  register: argocd_login
  changed_when: false
  no_log: true
  tags: argocd

- name: Create ArgoCD application
  command: >
    argocd app create {{ argocd_app_name }} --repo {{ argocd_repo_url }} --path {{ argocd_repo_path }} --dest-server https://kubernetes.default.svc --dest-namespace {{ k8s_namespace }} --revision {{ argocd_target_revision }} --sync-policy automated --auto-prune --self-heal --directory-recurse
  register: argocd_app
  failed_when:
  - argocd_app.rc != 0
  - "'already exists' not in argocd_app.stderr"
  changed_when: argocd_app.rc == 0
  tags: argocd

- name: Sync ArgoCD application
  command: >
    argocd app sync {{ argocd_app_name }} --force --async
  register: argocd_sync
  changed_when: argocd_sync.rc == 0
  failed_when:
  - argocd_sync.rc != 0
  - "'already in progress' not in argocd_sync.stderr"
  tags: argocd

- name: Wait for ArgoCD sync complete
  command: >
    argocd app wait {{ argocd_app_name }} --sync --timeout 300
  register: argocd_sync_wait
  changed_when: false
  failed_when: false
  tags: argocd

- name: Wait for ArgoCD app healthy
  command: >
    argocd app wait {{ argocd_app_name }} --health --timeout 300
  register: argocd_health
  changed_when: false
  failed_when: false
  tags: argocd

- name: Get ArgoCD app status
  command: argocd app get {{ argocd_app_name }}
  register: argocd_status
  changed_when: false
  tags: argocd

- name: Print ArgoCD app status
  debug:
    msg: "{{ argocd_status.stdout_lines }}"
  tags: argocd

# Custom Prometheus Alert Rules
# Covers: Pods, Nodes, Storage, Spring Boot JVM, Kafka

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecommerce-alert-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus
spec:
  groups:

  # Pod Alerts 
  - name: pod.rules
    interval: 30s
    rules:

    - alert: PodCrashLoopBackOff
      expr: |
        max_over_time(kube_pod_container_status_waiting_reason{
          reason="CrashLoopBackOff",
          namespace="ecommerce"
        }[5m]) == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} is in CrashLoopBackOff"
        description: >-
          Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in CrashLoopBackOff for more than 2 minutes. Container: {{ $labels.container }}

    - alert: PodNotReady
      expr: |
        sum by (namespace, pod) (
          max by (namespace, pod, condition) (
            kube_pod_status_conditions{
              condition="Ready",
              status="false",
              namespace="ecommerce"
            }
          )
        ) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is not ready"
        description: >-
          Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in not-ready state for more than 5 minutes.

    - alert: PodHighRestartCount
      expr: |
        increase(kube_pod_container_status_restarts_total{
          namespace="ecommerce"
        }[1h]) > 5
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} restarted {{ $value }} times"
        description: >-
          Pod {{ $labels.pod }} container {{ $labels.container }} has restarted {{ $value }} times in the last hour.

    - alert: PodOOMKilled
      expr: |
        kube_pod_container_status_last_terminated_reason{
          reason="OOMKilled",
          namespace="ecommerce"
        } == 1
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} was OOMKilled"
        description: >-
          Container {{ $labels.container }} in pod {{ $labels.pod }} was killed due to out of memory (OOMKilled). Consider increasing memory limits.

    - alert: PodPending
      expr: |
        kube_pod_status_phase{
          phase="Pending",
          namespace="ecommerce"
        } == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is stuck in Pending"
        description: >-
          Pod {{ $labels.pod }} has been in Pending state for more than 10 minutes. Check node resources or PVC binding.

    - alert: ContainerHighCPU
      expr: |
        sum by (namespace, pod, container) (
          rate(container_cpu_usage_seconds_total{
            namespace="ecommerce",
            container!=""
          }[5m])
        ) /
        sum by (namespace, pod, container) (
          kube_pod_container_resource_limits{
            namespace="ecommerce",
            resource="cpu"
          }
        ) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.container }} high CPU"
        description: >-
          Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | printf "%.1f" }}% of its CPU limit.

    - alert: ContainerHighMemory
      expr: |
        sum by (namespace, pod, container) (
          container_memory_working_set_bytes{
            namespace="ecommerce",
            container!=""
          }
        ) /
        sum by (namespace, pod, container) (
          kube_pod_container_resource_limits{
            namespace="ecommerce",
            resource="memory"
          }
        ) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.container }} high memory"
        description: >-
          Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | printf "%.1f" }}% of its memory limit.

  # Node Alerts 
  - name: node.rules
    interval: 30s
    rules:

    - alert: NodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} is not ready"
        description: >-
          Node {{ $labels.node }} has been in NotReady state for more than 2 minutes.

    - alert: NodeHighCPU
      expr: |
        100 - (
          avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          ) * 100
        ) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} high CPU"
        description: >-
          Node {{ $labels.instance }} CPU usage is {{ $value | printf "%.1f" }}% (threshold: 80%)

    - alert: NodeHighMemory
      expr: |
        (
          1 - (
            node_memory_MemAvailable_bytes /
            node_memory_MemTotal_bytes
          )
        ) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} high memory"
        description: >-
          Node {{ $labels.instance }} memory usage is {{ $value | printf "%.1f" }}% (threshold: 80%)

    - alert: NodeDiskPressure
      expr: |
        (
          node_filesystem_avail_bytes{
            mountpoint="/",
            fstype!="tmpfs"
          } /
          node_filesystem_size_bytes{
            mountpoint="/",
            fstype!="tmpfs"
          }
        ) * 100 < 20
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} low disk space"
        description: >-
          Node {{ $labels.instance }} has only {{ $value | printf "%.1f" }}% disk space remaining.

    - alert: NodeDiskCritical
      expr: |
        (
          node_filesystem_avail_bytes{
            mountpoint="/",
            fstype!="tmpfs"
          } /
          node_filesystem_size_bytes{
            mountpoint="/",
            fstype!="tmpfs"
          }
        ) * 100 < 10
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.instance }} critically low disk"
        description: >-
          Node {{ $labels.instance }} has only {{ $value | printf "%.1f" }}% disk space remaining. Immediate action required!

    - alert: NodeNetworkErrors
      expr: |
        rate(node_network_receive_errs_total[5m]) > 0 or
        rate(node_network_transmit_errs_total[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} network errors"
        description: >-
          Node {{ $labels.instance }} is experiencing network errors.

  # Storage Alerts 
  - name: storage.rules
    interval: 30s
    rules:

    - alert: PVCUsageHigh
      expr: |
        (
          kubelet_volume_stats_used_bytes /
          kubelet_volume_stats_capacity_bytes
        ) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} usage high"
        description: >-
          PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value | printf "%.1f" }}% full.

    - alert: PVCUsageCritical
      expr: |
        (
          kubelet_volume_stats_used_bytes /
          kubelet_volume_stats_capacity_bytes
        ) * 100 > 90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} critically full"
        description: >-
          PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value | printf "%.1f" }}% full. Expand immediately!

    - alert: PVCPending
      expr: |
        kube_persistentvolumeclaim_status_phase{
          phase="Pending",
          namespace="ecommerce"
        } == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} is Pending"
        description: >-
          PVC {{ $labels.persistentvolumeclaim }} has been in Pending state for more than 5 minutes.

  # Spring Boot JVM Alerts 
  - name: jvm.rules
    interval: 30s
    rules:

    - alert: JVMHeapUsageHigh
      expr: |
        (
          jvm_memory_used_bytes{area="heap"} /
          jvm_memory_max_bytes{area="heap"}
        ) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "JVM heap high in {{ $labels.pod }}"
        description: >-
          Pod {{ $labels.pod }} JVM heap usage is {{ $value | printf "%.1f" }}%. Consider increasing memory limits.

    - alert: JVMHeapUsageCritical
      expr: |
        (
          jvm_memory_used_bytes{area="heap"} /
          jvm_memory_max_bytes{area="heap"}
        ) * 100 > 90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "JVM heap critical in {{ $labels.pod }}"
        description: >-
          Pod {{ $labels.pod }} JVM heap usage is {{ $value | printf "%.1f" }}%. OOMKill risk is high!

    - alert: JVMGCTimeTooHigh
      expr: |
        rate(jvm_gc_pause_seconds_sum[5m]) /
        rate(jvm_gc_pause_seconds_count[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High GC pause in {{ $labels.pod }}"
        description: >-
          Pod {{ $labels.pod }} average GC pause is {{ $value | printf "%.3f" }} seconds. Application may be experiencing latency.

    - alert: JVMThreadsHigh
      expr: jvm_threads_live_threads > 200
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High thread count in {{ $labels.pod }}"
        description: >-
          Pod {{ $labels.pod }} has {{ $value }} live threads. Possible thread leak or high load.

  # Kafka Alerts 
  - name: kafka.rules
    interval: 30s
    rules:

    - alert: KafkaPodDown
      expr: |
        kube_pod_status_phase{
          pod=~"kafka-.*",
          namespace="ecommerce",
          phase!="Running"
        } == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Kafka pod is down"
        description: >-
          Kafka pod {{ $labels.pod }} is not in Running state. All Saga events will fail until Kafka is restored.

    - alert: ZookeeperPodDown
      expr: |
        kube_pod_status_phase{
          pod=~"zookeeper-.*",
          namespace="ecommerce",
          phase!="Running"
        } == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Zookeeper pod is down"
        description: >-
          Zookeeper pod {{ $labels.pod }} is not in Running state. Kafka depends on Zookeeper — Saga events will fail.

  # Deployment Alerts 
  - name: deployment.rules
    interval: 30s
    rules:

    - alert: DeploymentReplicasMismatch
      expr: |
        kube_deployment_spec_replicas{namespace="ecommerce"} !=
        kube_deployment_status_available_replicas{namespace="ecommerce"}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Deployment {{ $labels.deployment }} replicas mismatch"
        description: >-
          Deployment {{ $labels.deployment }} has {{ $value }} unavailable replicas in namespace {{ $labels.namespace }}.

    - alert: DeploymentNotAvailable
      expr: |
        kube_deployment_status_available_replicas{
          namespace="ecommerce"
        } == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Deployment {{ $labels.deployment }} has 0 available replicas"
        description: >-
          Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has no available replicas. Service is completely down!

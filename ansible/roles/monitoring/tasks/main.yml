---
- name: Create monitoring namespace
  command: kubectl create namespace {{ monitoring_namespace }}
  register: monitoring_ns
  failed_when:
  - monitoring_ns.rc != 0
  - "'already exists' not in monitoring_ns.stderr"
  changed_when: monitoring_ns.rc == 0
  tags: monitoring

- name: Create CloudWatch namespace
  command: kubectl create namespace {{ cloudwatch_namespace }}
  register: cloudwatch_ns
  failed_when:
  - cloudwatch_ns.rc != 0
  - "'already exists' not in cloudwatch_ns.stderr"
  changed_when: cloudwatch_ns.rc == 0
  tags: monitoring

- name: Add Prometheus Helm repository
  command: >
    helm repo add prometheus-community {{ prometheus_helm_repo }}
  register: prometheus_repo
  changed_when: "'already exists' not in prometheus_repo.stdout"
  failed_when:
  - prometheus_repo.rc != 0
  - "'already exists' not in prometheus_repo.stdout"
  tags: monitoring

- name: Add CloudWatch Helm repository
  command: >
    helm repo add eks {{ cloudwatch_helm_repo }}
  register: cloudwatch_repo
  changed_when: "'already exists' not in cloudwatch_repo.stdout"
  failed_when:
  - cloudwatch_repo.rc != 0
  - "'already exists' not in cloudwatch_repo.stdout"
  tags: monitoring

- name: Update all Helm repositories
  command: helm repo update
  changed_when: true
  tags: monitoring

- name: Create Grafana admin secret
  command: >
    kubectl create secret generic grafana-admin-secret --namespace {{ monitoring_namespace }} --from-literal=admin-user=admin --from-literal=admin-password={{ vault_grafana_admin_password }}
  register: grafana_secret
  failed_when:
  - grafana_secret.rc != 0
  - "'already exists' not in grafana_secret.stderr"
  changed_when: grafana_secret.rc == 0
  no_log: true
  tags: monitoring

- name: Render AlertManager config from template
  template:
    src: alertmanager-config.yml.j2
    dest: /tmp/alertmanager-config.yml
    mode: "0600"
  no_log: true
  tags: monitoring

- name: Render Prometheus Helm values from template
  template:
    src: prometheus-values.yml.j2
    dest: /tmp/prometheus-values.yml
    mode: "0644"
  tags: monitoring

- name: Install kube-prometheus-stack
  command: >
    helm upgrade --install prometheus prometheus-community/kube-prometheus-stack --namespace {{ monitoring_namespace }} --values /tmp/prometheus-values.yml --version {{ kube_prometheus_stack_version }} --wait --timeout 10m
  register: prometheus_install
  changed_when: prometheus_install.rc == 0
  failed_when: prometheus_install.rc != 0
  tags: monitoring

- name: Print Prometheus install result
  debug:
    msg: "{{ prometheus_install.stdout_lines[-5:] }}"
  tags: monitoring

- name: Create AlertManager config secret
  shell: |
    kubectl create secret generic alertmanager-prometheus-alertmanager \
      --namespace {{ monitoring_namespace }} \
      --from-file=alertmanager.yaml=/tmp/alertmanager-config.yml \
      --dry-run=client -o yaml | kubectl apply -f -
  register: alertmanager_config
  changed_when: alertmanager_config.rc == 0
  no_log: true
  tags: monitoring

- name: Apply custom alert rules
  command: >
    kubectl apply -f {{ role_path }}/files/alert-rules.yml
  register: alert_rules
  changed_when: "'created' in alert_rules.stdout or 'configured' in alert_rules.stdout"
  failed_when: alert_rules.rc != 0
  tags: monitoring

- name: Cleanup sensitive rendered files
  file:
    path: "{{ item }}"
    state: absent
  loop:
  - /tmp/alertmanager-config.yml
  no_log: true
  tags: monitoring

- name: Render CloudWatch Helm values from template
  template:
    src: cloudwatch-values.yml.j2
    dest: /tmp/cloudwatch-values.yml
    mode: "0644"
  tags: monitoring

- name: Install CloudWatch Container Insights
  command: >
    helm upgrade --install aws-cloudwatch-metrics eks/aws-cloudwatch-metrics --namespace {{ cloudwatch_namespace }} --values /tmp/cloudwatch-values.yml --version {{ cloudwatch_agent_version }} --wait --timeout 5m
  register: cloudwatch_install
  changed_when: cloudwatch_install.rc == 0
  failed_when: false
  tags: monitoring

- name: Print CloudWatch install result
  debug:
    msg: "{{ cloudwatch_install.stdout_lines[-3:] }}"
  tags: monitoring

- name: Cleanup CloudWatch temp files
  file:
    path: /tmp/cloudwatch-values.yml
    state: absent
  tags: monitoring

- name: Wait for Grafana ready
  command: >
    kubectl rollout status deployment/grafana -n {{ monitoring_namespace }} --timeout=300s
  register: grafana_status
  changed_when: false
  failed_when: grafana_status.rc != 0
  tags: monitoring

- name: Wait for Prometheus operator ready
  command: >
    kubectl rollout status deployment/prometheus-operator -n {{ monitoring_namespace }} --timeout=300s
  register: operator_status
  changed_when: false
  failed_when: operator_status.rc != 0
  tags: monitoring

- name: Wait for kube-state-metrics ready
  command: >
    kubectl rollout status deployment/prometheus-kube-state-metrics -n {{ monitoring_namespace }} --timeout=300s
  register: ksm_status
  changed_when: false
  failed_when: ksm_status.rc != 0
  tags: monitoring

- name: Get monitoring pod status
  command: kubectl get pods -n {{ monitoring_namespace }}
  register: monitoring_pods
  changed_when: false
  tags: monitoring

- name: Print monitoring pod status
  debug:
    msg: "{{ monitoring_pods.stdout_lines }}"
  tags: monitoring

- name: Get CloudWatch pod status
  command: kubectl get pods -n {{ cloudwatch_namespace }}
  register: cloudwatch_pods
  changed_when: false
  tags: monitoring

- name: Print CloudWatch pod status
  debug:
    msg: "{{ cloudwatch_pods.stdout_lines }}"
  tags: monitoring

- name: Get Grafana service info
  command: kubectl get svc grafana -n {{ monitoring_namespace }}
  register: grafana_svc
  changed_when: false
  tags: monitoring

- name: Print Grafana access instructions
  debug:
    msg:
    - "======================================"
    - "Grafana Dashboard Access"
    - "======================================"
    - "Run this command to access Grafana:"
    - "kubectl port-forward svc/grafana 3000:80 -n {{ monitoring_namespace }}"
    - "Then open: http://localhost:3000"
    - "Username: admin"
    - "Password: (from vault_grafana_admin_password)"
    - "======================================"
  tags: monitoring

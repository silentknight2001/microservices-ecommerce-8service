name: Inventory Service CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'inventory-service/**'
      - 'common-library/**'
      - 'pom.xml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'inventory-service/**'
      - 'common-library/**'
      - 'pom.xml'

env:
  SERVICE_NAME: inventory-service
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service
  AWS_REGION: ap-south-1

jobs:
  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build common-library first every service needs this
      - name: Build & install common-library
        run: mvn install -pl common-library -am -DskipTests

      - name: Build inventory-service
        run: mvn package -pl inventory-service -am -DskipTests

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate Docker tags:
      # main branch  → latest + sha-xxxxxxx
      # develop      → develop + sha-xxxxxxx
      # pull request → only build, no push
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./inventory-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image digest
        run: echo "Image pushed → ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}"

  deploy:
    name: Update K8s Manifest (GitOps)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_OPS_TOKEN }}
          fetch-depth: 0

      - name: Update image tag in k8s manifest
        run: |
          SHORT_SHA=$(echo ${{ github.sha }}) | cut -c1-7 )
          sed -i 's|image: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:sha-${{ github.sha }}|' \
          infrastructure/k8s/inventory-service/Deployment.yml

      - name: Commit & push updated manifest
        run: |
          SHORT_SHA=$(echo ${{ github.sha }}) | cut -c1-7 )
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/k8s/inventory-service/Deployment.yml
          git commit -m "ci(inventory-service): update image to sha-${{ github.sha }}"
          git push 
        

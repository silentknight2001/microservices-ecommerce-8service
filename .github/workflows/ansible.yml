name: Ansible Configuration

on:
  workflow_run:
    workflows: ["Terraform Infrastructure"]
    types:
      - completed
    branches:
      - main
      - staging
      - develop

  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'ansible/**'
      - 'infrastructure/k8s/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to configure'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ANSIBLE_DIR: ansible

jobs:
  set-environment:
    name: Set Environment
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              ENV="dev"
            elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
              ENV="staging"
            else
              ENV="dev"
            fi
          elif [ "${{ github.event.workflow_run.head_branch }}" == "main" ]; then
            ENV="dev"
          elif [ "${{ github.event.workflow_run.head_branch }}" == "staging" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Running ansible for environment: $ENV"

  ansible-configure:
    name: Ansible Configure (${{ needs.set-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.15.2'

      - name: Install Ansible
        run: |
          pip install ansible
          ansible --version

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd version --client

      - name: Update kubeconfig
        run: |
          ENV=${{ needs.set-environment.outputs.environment }}
          CLUSTER_NAME="ecommerce-eks-$ENV"
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name $CLUSTER_NAME
          kubectl cluster-info

      - name: Create vault files
        run: |
          # Create vault password file
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/.vault_pass
          chmod 600 /tmp/.vault_pass
          # Create vault.yml dynamically from GitHub Secrets
          cat > ${{ env.ANSIBLE_DIR }}/group_vars/vault.yml << EOF
          vault_postgres_password: "${{ secrets.POSTGRES_PASSWORD }}"
          vault_grafana_admin_password: "${{ secrets.GRAFANA_PASSWORD }}"
          vault_alert_email_from: "${{ secrets.ALERT_EMAIL_FROM }}"
          vault_alert_email_password: "${{ secrets.ALERT_EMAIL_PASSWORD }}"
          vault_alert_email_to: "${{ secrets.ALERT_EMAIL_TO }}"
          EOF
          chmod 600 ${{ env.ANSIBLE_DIR }}/group_vars/vault.yml

      - name: Run Ansible playbook
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook playbooks/setup-eks.yml \
            --vault-password-file /tmp/.vault_pass \
            -e "cluster_name=ecommerce-eks-${{ needs.set-environment.outputs.environment }}" \
            -e "environment=${{ needs.set-environment.outputs.environment }}" \
            -v

      - name: Cleanup vault files
        if: always()
        run: |
          rm -f /tmp/.vault_pass
          rm -f ${{ env.ANSIBLE_DIR }}/group_vars/vault.yml

      - name: Get ALB DNS
        id: alb
        run: |
          ALB_DNS=$(kubectl get ingress ecommerce-ingress \
            -n ecommerce \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
            2>/dev/null || echo "Not yet assigned")
          echo "ALB DNS: $ALB_DNS"
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Health check application
        run: |
          ALB_DNS="${{ steps.alb.outputs.alb_dns }}"
          if [ "$ALB_DNS" != "Not yet assigned" ]; then
            curl -f http://$ALB_DNS/actuator/health || \
              echo "Health check failed - ALB may still be provisioning"
          else
            echo "ALB DNS not assigned yet"
          fi

      - name: Print deployment summary
        if: always()
        run: |
          echo "================================"
          echo "Deployment Summary"
          echo "================================"
          echo "Environment: ${{ needs.set-environment.outputs.environment }}"
          echo "Cluster: ecommerce-eks-${{ needs.set-environment.outputs.environment }}"
          echo "ALB DNS: ${{ steps.alb.outputs.alb_dns }}"
          echo "================================"
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ecommerce-eks-${{ needs.set-environment.outputs.environment }} \
            2>/dev/null || true
          kubectl get pods -n ecommerce 2>/dev/null || \
            echo "Could not connect to cluster"